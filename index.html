<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="缝隙写作台">
<link rel="manifest" href="manifest.json">

<title>缝隙 100 天 · 写作台</title>
<style>
:root{
  --bg:#FAF8F3; --card:#FFFFFF; --ink:#33352F; --ink2:#6E7269; --ink3:#9A9E94;
  --line:#E8E5DA; --line2:#D8D4C6;
  --green:#5C7F68; --green-l:#EAF1EA; --green-d:#3E5C49;
  --warm:#C0865C; --warm-l:#FAF0E6;
  --rose:#B4635C; --rose-l:#FBEFEC;
  --r:14px; --rs:9px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 100px}
header{padding:26px 0 14px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-size:23px;font-weight:600;margin:0;letter-spacing:.5px}
.brand .sub{font-size:12.5px;color:var(--ink3)}
.motto{margin:10px 0 0;font-size:13.5px;color:var(--green-d);font-weight:500}
.motto small{display:block;font-weight:400;color:var(--ink3);font-size:12px;margin-top:3px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0 14px;scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:20;border-bottom:1px solid var(--line);margin-bottom:20px}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1px solid var(--line2);background:var(--card);color:var(--ink2);padding:7px 15px;border-radius:999px;font-size:13.5px;font-family:var(--font);cursor:pointer;transition:.15s}
nav button.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:500}
nav button:not(.on):hover{border-color:var(--green);color:var(--green-d)}
section{display:none;animation:fade .22s ease}
section.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card.tint{background:var(--green-l);border-color:#DCE8DC}
.card.warmtint{background:var(--warm-l);border-color:#F0E2D2}
h2{font-size:17px;font-weight:600;margin:0 0 4px}
h3{font-size:14.5px;font-weight:600;margin:18px 0 8px}
.hint{font-size:12.5px;color:var(--ink3);margin:0 0 14px;line-height:1.6}
.hint b{color:var(--ink2);font-weight:500}
.big{font-size:34px;font-weight:600;color:var(--green-d);line-height:1.2;letter-spacing:-1px}
.big span{font-size:15px;color:var(--ink3);font-weight:400;letter-spacing:0}
.stat{display:flex;gap:26px;flex-wrap:wrap;margin-top:12px}
.stat div{font-size:12.5px;color:var(--ink3)}
.stat strong{display:block;font-size:20px;color:var(--ink);font-weight:600;line-height:1.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line2);background:var(--card);color:var(--ink2);padding:7px 13px;border-radius:var(--rs);font-size:13px;font-family:var(--font);cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--green);color:var(--green-d)}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.pri:hover{background:var(--green-d);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--rose);border-color:#EBD4D0}
.btn.danger:hover{border-color:var(--rose);color:var(--rose)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
input[type=text],input[type=date],textarea,select{font-family:var(--font);font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line2);border-radius:var(--rs);padding:9px 11px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-l)}
textarea{resize:vertical;line-height:1.8}
label.lbl{font-size:12.5px;color:var(--ink2);display:block;margin:0 0 5px}
.field{margin-bottom:14px}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--green-l);color:var(--green-d);font-weight:500;white-space:nowrap}
.pill.warm{background:var(--warm-l);color:var(--warm)}
.pill.rose{background:var(--rose-l);color:var(--rose)}
.pill.gray{background:#F2F1EC;color:var(--ink3)}
.pill.node{background:var(--green);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--ink3);font-weight:500;background:#FCFBF7}
tr:last-child td{border-bottom:none}
.tbl-scroll{overflow-x:auto;margin:0 -18px;padding:0 18px}
.list-item{border:1px solid var(--line);border-radius:var(--rs);padding:11px 13px;margin-bottom:8px;background:var(--card)}
.li-top{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.li-title{flex:1;min-width:180px;font-size:14px;line-height:1.55}
.li-meta{font-size:12px;color:var(--ink3);margin-top:4px}
.li-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.doc{border:1px solid var(--line);border-radius:var(--rs);margin-bottom:10px;overflow:hidden;background:var(--card)}
.doc-h{display:flex;align-items:center;gap:9px;padding:11px 13px;cursor:pointer;user-select:none}
.doc-h:hover{background:#FCFBF7}
.doc-h .t{flex:1;font-size:14px;font-weight:500;min-width:0}
.doc-b{display:none;border-top:1px solid var(--line);padding:13px;background:#FDFCFA}
.doc.open .doc-b{display:block}
.doc-b pre{white-space:pre-wrap;word-break:break-word;font-family:var(--font);font-size:13.5px;line-height:1.85;margin:0;color:var(--ink)}
.chev{font-size:11px;color:var(--ink3);transition:.2s}
.doc.open .chev{transform:rotate(90deg)}
.grp-title{font-size:12px;font-weight:600;color:var(--green-d);letter-spacing:.5px;margin:20px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grp-title:first-child{margin-top:2px}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer}
.check:last-child{border-bottom:none}
.check input{width:17px;height:17px;flex:0 0 auto;margin-top:3px;accent-color:var(--green)}
.check.done span{color:var(--ink3);text-decoration:line-through}
.check span{flex:1}
.tag-cloud{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12px;color:var(--green-d);background:var(--green-l);padding:3px 9px;border-radius:999px;cursor:pointer}
.tag:hover{background:#DCE8DC}
.note{font-size:12.5px;color:var(--ink2);background:#FCFBF7;border-left:3px solid var(--line2);padding:9px 12px;border-radius:0 var(--rs) var(--rs) 0;margin:10px 0;line-height:1.7}
.note.warn{background:var(--rose-l);border-left-color:#DCA9A3;color:#8B4B45}
.note.ok{background:var(--green-l);border-left-color:#A8C6AE;color:var(--green-d)}
.kv{display:grid;grid-template-columns:88px 1fr;gap:7px 12px;font-size:13.5px;margin-top:8px}
.kv dt{color:var(--ink3);font-size:12.5px}
.kv dd{margin:0}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scan-result{margin-top:12px;font-size:13.5px}
.scan-line{padding:8px 11px;border-radius:var(--rs);margin-bottom:6px;line-height:1.6}
.scan-line.bad{background:var(--rose-l);color:#8B4B45}
.scan-line.mid{background:var(--warm-l);color:#8A5C35}
.scan-line.good{background:var(--green-l);color:var(--green-d)}
.counter{font-size:12px;color:var(--ink3);margin-top:7px}
.counter b{color:var(--warm);font-weight:600}
.mini{font-size:12px;color:var(--ink3)}
.divider{height:1px;background:var(--line);margin:18px 0}
.flow{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:13px;margin-top:10px}
.flow span{background:var(--green-l);color:var(--green-d);padding:5px 10px;border-radius:var(--rs)}
.flow i{font-style:normal;color:var(--ink3);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){
  .wrap{padding:0 12px 90px} header{padding:18px 0 10px} h1{font-size:20px}
  .card{padding:14px} .tbl-scroll{margin:0 -14px;padding:0 14px}
  .two{grid-template-columns:1fr} .big{font-size:30px}
  nav button{padding:6px 12px;font-size:13px}
  .li-meta{line-height:1.75;font-size:11.5px}
  .list-item{padding:12px 11px}
  .li-acts{gap:5px}
  .li-acts .btn{flex:0 0 auto}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>

</div>

<script>
"use strict";
const D = JSON.parse(document.getElementById('DATA').textContent);
const KEY = 'xhs-gap-studio-v1';
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const DEFAULT = () => ({
  startDate:'', schedule:{}, topics:{}, customTopics:[], checks:{},
  editor:{ref:'',title:'',body:''}, settings:{}
});
let S = DEFAULT();
try{ const raw = localStorage.getItem(KEY); if(raw){ const p=JSON.parse(raw); S = Object.assign(DEFAULT(),p); S.editor=Object.assign({ref:'',title:'',body:''},p.editor||{}); } }catch(e){}
const save = () => { try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ toast('本地存储写入失败，建议导出备份'); } };
let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2000); }
function copy(text,label){
  const done=()=>toast((label||'已复制')+' ✓');
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done).catch(()=>fallback()); } else fallback();
  function fallback(){ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');done();}catch(e){toast('复制失败，请手动选中');} document.body.removeChild(ta); }
}
function dayNo(){
  if(!S.startDate) return null;
  const a=new Date(S.startDate+'T00:00:00'), b=new Date(); b.setHours(0,0,0,0);
  if(isNaN(a)) return null;
  return Math.floor((b-a)/86400000)+1;
}
const stName = {'todo':'待写','draft':'写着','done':'已发'};
const stPill = {'todo':'gray','draft':'warm','done':''};
function sc(n){ return S.schedule[n] || (S.schedule[n]={status:'todo',date:'',note:'',title:''}); }
function topicKey(cat,i){ return cat+'|'+i; }

/* ---------- nav ---------- */
const TABS=[['today','今天'],['plan','排期'],['topics','选题库'],['docs','文案库'],['write','写作区'],['check','发布自检'],['method','方法论'],['data','数据']];
$('#nav').innerHTML = TABS.map((t,i)=>`<button data-t="${t[0]}" class="${i===0?'on':''}">${t[1]}</button>`).join('');
$('#nav').addEventListener('click',e=>{ const b=e.target.closest('button[data-t]'); if(!b)return; go(b.dataset.t); });
function go(t){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='s-'+t));
  render(t); window.scrollTo({top:0,behavior:'smooth'});
}
function render(t){ ({today:rToday,plan:rPlan,topics:rTopics,docs:rDocs,write:rWrite,check:rCheck,method:rMethod,data:rData})[t](); }

/* ---------- 今天 ---------- */
function rToday(){
  const d=dayNo(); const done=D.schedule.filter(x=>sc(x.n).status==='done').length;
  const draft=D.schedule.filter(x=>sc(x.n).status==='draft').length;
  let dayTxt = d===null ? '<span>还没设起始日</span>' : (d<1? '<span>还没开始</span>' : `<span>Day ${d} / 100</span>`);
  const upcoming = D.schedule.filter(x=> d===null || x.day>=d).slice(0,3);
  const q=D.quotes[new Date().getDate()%D.quotes.length];
  $('#s-today').innerHTML=`
  <div class="card tint">
    <h2>今天</h2>
    <div class="big">${dayTxt}</div>
    <div class="stat">
      <div><strong>${done}</strong>篇已发</div>
      <div><strong>${draft}</strong>篇写着</div>
      <div><strong>${D.schedule.length-done}</strong>篇还可以写</div>
    </div>
    <div class="note ok" style="margin-bottom:0">不显示完成率、不记连续天数。断了就接着写，只做一件也算没断。</div>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">100 天从哪天算</h2><span class="mini">可随时改</span>
    </div>
    <p class="hint" style="margin:6px 0 12px">设一个起始日，首页就会显示 Day 几。不设也能用，排期照常写。</p>
    <div class="row">
      <input type="date" id="startDate" value="${esc(S.startDate)}" style="max-width:210px">
      <button class="btn" id="setToday">从今天开始</button>
      <button class="btn" id="clearStart">清除</button>
    </div>
  </div>
  <div class="card">
    <h2>${d===null?'接下来可以写':'接下来这几篇'}</h2>
    <p class="hint">节点式更新，不硬凑日更。没灵感就只发节点那 10 篇，飞轮照样转。</p>
    ${upcoming.length?upcoming.map(x=>`
      <div class="list-item"><div class="li-top">
        <div class="li-title">${esc(x.title)}<div class="li-meta">Day ${x.day} · ${x.node?'<span class="pill node">节点</span> ':''}${esc(D.howByType[x.type].split(' · ')[0])} · 素材 ${x.asset==='图'?'工具分享图':'100 天回顾页'}</div></div>
      </div><div class="li-acts"><button class="btn sm" data-gowrite="${x.n}">写这篇 →</button></div></div>`).join(''):'<div class="note">排期都走完了，去选题库挑一条，或者再开一轮。</div>'}
    <div class="row" style="margin-top:12px"><button class="btn" data-go="plan">看全部 30 篇</button><button class="btn" data-go="topics">逛选题库</button><button class="btn pri" data-go="write">去写作区</button></div>
  </div>
  <div class="card warmtint"><div class="mini" style="margin-bottom:6px">今天的一句话</div><div style="font-size:16px;color:var(--green-d);font-weight:500">「${esc(q)}」</div></div>
  <div class="card">
    <h2>三条不动的红线</h2>
    <div class="row" style="margin-top:10px">${D.redline.map(x=>`<span class="pill rose">${esc(x)}</span>`).join('')}</div>
    <div class="note" style="margin-bottom:0">标题可以出现数字（3 个不 / 6 件 / 100 天 / 121→105→115），但方法内核不算身体数字、不承诺结果。详见「方法论」。</div>
  </div>`;
  $('#startDate').addEventListener('change',e=>{S.startDate=e.target.value;save();rToday();});
  $('#setToday').addEventListener('click',()=>{S.startDate=new Date().toLocaleDateString('sv-SE');save();rToday();toast('起始日设为今天');});
  $('#clearStart').addEventListener('click',()=>{S.startDate='';save();rToday();});
  bindCommon($('#s-today'));
}

/* ---------- 排期 ---------- */
let planFilter='all';
function rPlan(){
  const counts={all:D.schedule.length,todo:0,draft:0,done:0,node:0};
  D.schedule.forEach(x=>{const s=sc(x.n).status;counts[s]++;if(x.node)counts.node++;});
  const list=D.schedule.filter(x=> planFilter==='all'?true : planFilter==='node'? !!x.node : sc(x.n).status===planFilter);
  $('#s-plan').innerHTML=`
  <div class="card">
    <h2>30 篇 Day 连载排期</h2>
    <p class="hint">10 个节点锚笔记 + 20 篇轻量随笔。带「图」的发之前先在工具勾完格子、导出分享图，图自带 Day/100，等于白送一张连载封面。</p>
    <div class="row" style="margin-bottom:12px">
      ${[['all','全部'],['node','只看节点'],['todo','待写'],['draft','写着'],['done','已发']].map(f=>`<button class="btn sm ${planFilter===f[0]?'pri':''}" data-pf="${f[0]}">${f[1]} ${counts[f[0]]}</button>`).join('')}
    </div>
    <div id="planList"></div>
  </div>
  <div class="card tint"><h2>排期心法</h2>
    <div class="kv"><dt>节点锚</dt><dd>10 个里程碑各发 1 篇，是追更理由</dd>
    <dt>轻量填</dt><dd>中间发约 20 篇随笔，是存在感，不硬凑日更</dd>
    <dt>工具不停</dt><dd>每天勾格子不中断；写笔记只在想发时做</dd>
    <dt>配比</dt><dd>Day 连载 60% / 六件事拆解 20% / 三个不 10% / 一起勾的人 10%</dd></div>
  </div>`;
  $('#planList').innerHTML = list.map(x=>{
    const s=sc(x.n); const title=s.title||x.title;
    return `<div class="list-item">
      <div class="li-top">
        <span class="pill ${stPill[s.status]}">${stName[s.status]}</span>
        <div class="li-title"><input type="text" data-title="${x.n}" value="${esc(title)}" style="border:none;background:transparent;padding:2px 0;font-size:14px;font-weight:500">
          <div class="li-meta">#${x.n} · Day ${x.day} ${x.node?'· <span class="pill node">节点</span>':''} · 类型 ${x.type} · 素材 ${x.asset==='图'?'分享图':'回顾页'} · ${esc(D.howByType[x.type])}</div>
        </div>
      </div>
      <div class="li-acts">
        <button class="btn sm" data-cyc="${x.n}">状态 → ${s.status==='todo'?'写着':s.status==='draft'?'已发':'待写'}</button>
        <button class="btn sm" data-gowrite="${x.n}">写这篇</button>
        <button class="btn sm" data-copytitle="${x.n}">复制标题</button>
        <input type="date" data-date="${x.n}" value="${esc(s.date||'')}" style="width:145px;padding:4px 8px;font-size:12px" title="发布日期">
      </div>
      <div style="margin-top:8px"><input type="text" data-note="${x.n}" value="${esc(s.note||'')}" placeholder="备注：链接 / 灵感 / 配图进度" style="font-size:12.5px;padding:6px 9px"></div>
    </div>`;}).join('');
  $('#planList').addEventListener('change',e=>{
    const t=e.target;
    if(t.dataset.title!==undefined){sc(t.dataset.title).title=t.value;save();}
    if(t.dataset.note!==undefined){sc(t.dataset.note).note=t.value;save();}
    if(t.dataset.date!==undefined){sc(t.dataset.date).date=t.value;save();}
  });
  $('#planList').addEventListener('click',e=>{
    const cyc=e.target.closest('[data-cyc]'); if(cyc){const s=sc(cyc.dataset.cyc);s.status=s.status==='todo'?'draft':s.status==='draft'?'done':'todo';save();rPlan();return;}
    const cp=e.target.closest('[data-copytitle]'); if(cp){const x=D.schedule.find(v=>v.n==cp.dataset.copytitle);copy(sc(x.n).title||x.title,'标题');return;}
  });
  document.querySelectorAll('[data-pf]').forEach(b=>b.addEventListener('click',()=>{planFilter=b.dataset.pf;rPlan();}));
  bindCommon($('#s-plan'));
}

/* ---------- 选题库 ---------- */
let topicFilter='all';
function rTopics(){
  let html='';
  D.topics.forEach((g,gi)=>{
    html+=`<div class="grp-title">${esc(g.cat)}</div>`;
    g.items.forEach((t,i)=>{
      const k=topicKey(gi,i), s=S.topics[k]||'';
      if(topicFilter==='used'&&s!=='used')return;
      if(topicFilter==='want'&&s!=='want')return;
      if(topicFilter==='todo'&&s==='used')return;
      html+=`<div class="list-item"><div class="li-top">
        <div class="li-title">${esc(t)}${s==='used'?' <span class="pill">已用</span>':s==='want'?' <span class="pill warm">想写</span>':s==='skip'?' <span class="pill gray">跳过</span>':''}</div></div>
        <div class="li-acts">
          <button class="btn sm" data-tst="${esc(k)}" data-v="want">想写</button>
          <button class="btn sm" data-tst="${esc(k)}" data-v="used">标已用</button>
          <button class="btn sm" data-tst="${esc(k)}" data-v="skip">跳过</button>
          <button class="btn sm" data-twrite="${esc(t)}">写这篇 →</button>
          <button class="btn sm" data-copy="${esc(t)}">复制</button>
        </div></div>`;
    });
  });

const RULES=[
  {re:/(不反弹|根治多囊|改善多囊|降胰岛素|控糖|易瘦体质|躺瘦|不用运动也能瘦)/g,lv:'bad',why:'功效 / 疗效承诺，账号带 PCOS 标签更敏感'},
  {re:/([0-9一二三四五六七八九十]+\s*(天|周|个月)[^。\n]{0,8}(瘦|减|掉)[^。\n]{0,4}(斤|公斤|kg))|(瘦\s*[0-9]+\s*(斤|公斤|kg))|(一个月[^。\n]{0,8}(斤|公斤))/g,lv:'bad',why:'掉秤数字 / 周期效果承诺'},
  {re:/(《中国[^》]*指南|膳食指南|营养师(建议|说)|医生建议|遵医嘱)/g,lv:'bad',why:'专业背书，未核实出处或涉资质风险'},
  {re:/(微信|加我|私我|加V|vx|vx号|扫码|二维码|https?:\/\/|www\.|github\.io|小程序搜|站外)/g,lv:'bad',why:'站外导流，笔记 / 评论里属高风险'},
  {re:/(代餐|减肥药|酵素|减肥茶|疗效|体脂秤|食物秤|卡路里\s*App)/g,lv:'bad',why:'违禁品类或黑名单商单'},
  {re:/(进得比出得少|热量缺口|基础代谢|胰岛素)/g,lv:'mid',why:'机制表述：公开内容里淡化原理，只讲日子不讲道理'},
  {re:/(这样能瘦|适合多囊|大家都应该|你应该|建议你们)/g,lv:'mid',why:'口径统一用「我自己的做法」，不给他人方案'},
  {re:/__/g,lv:'mid',why:'占位符未替换：换成真实记录，没有就写「记了一阵子」，别编数字'},
  {re:/[0-9]+\s*(斤|公斤|kg)/g,lv:'mid',why:'出现体重数字：确认是真实经历（如 121→105→115）而非效果承诺'}
];
function scan(text){
  const out=[]; RULES.forEach(r=>{ r.re.lastIndex=0; const m=text.match(r.re); if(m) out.push({lv:r.lv,why:r.why,hit:[...new Set(m)].slice(0,4).join(' / ')}); });
  return out;
}

    </div>
    <div class="row">
      <button class="btn pri" id="wScan">发布前体检</button>
      <button class="btn" id="wCopy">复制标题 + 正文</button>
      <button class="btn" id="wCopyAll">复制全文（含标签）</button>
      <button class="btn" id="wClear">清空</button>
    </div>
    <div id="scanOut"></div>
  </div>
  <div class="card">
    <h2>快捷插入</h2><p class="hint">点一下插到正文末尾。</p>
    <div class="grp-title">白话翻译层</div><div class="row">${D.translate.map((t,i)=>`<button class="btn sm" data-ins="t${i}">翻译 ${i+1}</button>`).join('')}</div>
    <div class="grp-title">金句</div><div class="row">${D.quotes.map((t,i)=>`<button class="btn sm" data-ins="q${i}">${esc(t.slice(0,10))}…</button>`).join('')}</div>
    <div class="grp-title">话题标签</div><div class="tag-cloud">${D.tags.map(t=>`<span class="tag" data-ins="tag" data-v="${esc(t)}">${esc(t)}</span>`).join('')}</div>
    <div class="row" style="margin-top:10px"><button class="btn sm" data-ins="alltags">插入全部标签</button><button class="btn sm" data-ins="cta">插入「一起勾」结尾</button></div>
  </div>
  <div class="card warmtint"><h2>标题可以用数字</h2>
    <p class="hint" style="margin-bottom:8px">方法内核不算身体数字，≠ 标题不能出现数字。数字讲「过程 / 结构 / 天数 / 真实经历」都可以，唯独不能承诺结果。</p>
    <div class="two"><div><div class="mini" style="color:var(--green-d)">✅ 可以用</div>${D.numbersOk.map(t=>`<div class="li-meta" style="font-size:13px">· ${esc(t)}</div>`).join('')}</div>
    <div><div class="mini" style="color:var(--rose)">🚫 不要用</div>${D.numbersNo.map(t=>`<div class="li-meta" style="font-size:13px">· ${esc(t)}</div>`).join('')}</div></div>
  </div>`;
  const upd=()=>{
    const b=$('#wBody').value, t=$('#wTitle').value;
    S.editor.body=b;S.editor.title=t;S.editor.ref=$('#wRef').value;save();
    const ph=(b.match(/__/g)||[]).length;
    $('#wCount').innerHTML=`正文 ${b.replace(/\s/g,'').length} 字 · 标题 ${t.length} 字${t.length>20?' <span style="color:var(--warm)">（小红书标题建议 20 字内）</span>':''}${ph?` · <b>还有 ${ph} 处 __ 占位没换</b>`:''}`;
  };
  $('#wBody').addEventListener('input',upd); $('#wTitle').addEventListener('input',upd);
  $('#wRef').addEventListener('change',()=>{const n=$('#wRef').value;if(n){const x=D.schedule.find(v=>v.n==n);if(x&&!$('#wTitle').value){$('#wTitle').value=sc(n).title||x.title;}}upd();});
  upd();
  $('#wScan').addEventListener('click',()=>{
    const res=scan($('#wTitle').value+'\n'+$('#wBody').value);
    const bad=res.filter(r=>r.lv==='bad'),mid=res.filter(r=>r.lv==='mid');
    $('#scanOut').innerHTML=`<div class="scan-result">
      ${bad.length?`<div class="note warn">下面 ${bad.length} 处建议改掉再发</div>`+bad.map(r=>`<div class="scan-line bad"><b>建议改</b> · ${esc(r.why)}<br><span class="mini">命中：${esc(r.hit)}</span></div>`).join(''):''}
      ${mid.length?`<div class="note">下面 ${mid.length} 处看一眼，确认是不是有意的</div>`+mid.map(r=>`<div class="scan-line mid"><b>看一眼</b> · ${esc(r.why)}<br><span class="mini">命中：${esc(r.hit)}</span></div>`).join(''):''}
      ${!bad.length?`<div class="scan-line good">✅ 没有发现掉秤承诺、功效宣称、专业背书或站外导流。${!mid.length?'全文干净。':''}</div>`:''}
      <div class="note" style="margin-top:10px">自动检查只兜底，发布前请人工过一遍图文、标签和图片里的文字。平台规则以小红书后台实时显示为准。</div>
    </div>`;
  });
  $('#wCopy').addEventListener('click',()=>copy(($('#wTitle').value?$('#wTitle').value+'\n\n':'')+$('#wBody').value,'已复制'));
  $('#wCopyAll').addEventListener('click',()=>copy(($('#wTitle').value?$('#wTitle').value+'\n\n':'')+$('#wBody').value+'\n\n'+D.tags.join(' '),'全文含标签'));
  $('#wClear').addEventListener('click',()=>{if(!confirm('清空当前写作区？排期和选题库不受影响。'))return;$('#wTitle').value='';$('#wBody').value='';upd();$('#scanOut').innerHTML='';});
  $('#s-write').onclick=e=>{
    const b=e.target.closest('[data-ins]');if(!b)return;
    const k=b.dataset.ins; let v='';
    if(k.startsWith('t'))v=D.translate[+k.slice(1)];
    else if(k.startsWith('q'))v='「'+D.quotes[+k.slice(1)]+'」';
    else if(k==='tag')v=b.dataset.v;
    else if(k==='alltags')v='\n\n'+D.tags.join(' ');
    else if(k==='cta')v='\n\n要不要一起？每天勾几格就行，只做一件也算数 👇';
    const ta=$('#wBody'); ta.value=(ta.value?ta.value+'\n\n':'')+v; ta.focus();ta.scrollTop=ta.scrollHeight;upd();toast('已插入');
  };
}

/* ---------- 发布自检 ---------- */
function rCheck(){
  const ck=S.checks;
  $('#s-check').innerHTML=`
  <div class="card"><h2>发布前合规清单</h2>
    <p class="hint">每篇发之前过一遍。勾选状态会记住，下一篇可以重新勾。</p>
    ${D.compliance.map((t,i)=>`<label class="check ${ck['c'+i]?'done':''}"><input type="checkbox" data-ck="c${i}" ${ck['c'+i]?'checked':''}><span>${esc(t)}</span></label>`).join('')}
    <div class="row" style="margin-top:12px"><button class="btn" id="resetChecks">重置勾选</button><button class="btn pri" data-go="write">去写作区体检</button></div>
  </div>
  <div class="card"><h2>前 10 篇 · 信号自检</h2>
    <p class="hint">不用等 100 天。按节点式，前 10 篇约覆盖前 3~4 周，看信号而不是猜。</p>
    <div class="tbl-scroll"><table><tr><th style="width:34%">早期信号</th><th>说明什么</th><th>该怎么调</th></tr>
    ${D.signals.map(x=>`<tr><td>${esc(x.s)}</td><td>${esc(x.m)}</td><td>${esc(x.d)}</td></tr>`).join('')}</table></div>
    <div class="note ok">观察期内三条红线不动：三个不 / 不算数字 / 不承诺结果。不达标只调标题和封面。</div>
  </div>
  <div class="card"><h2>判断做对了的信号</h2>
    <p style="font-size:14px;margin:0">不是点赞涨了，是评论里出现「Day __ 打卡」「今天只做了一件」「我空了三天回来了」。<b>有人用你的语言说话，说明方法论被接住了。</b></p>
  </div>`;
  $('#s-check').onchange=e=>{const t=e.target;if(t.dataset.ck){ck[t.dataset.ck]=t.checked;save();rCheck();}};
  $('#resetChecks').onclick=()=>{S.checks={};save();rCheck();};
  $('#s-check').onclick=commonClick;
}

/* ---------- 方法论 ---------- */
function rMethod(){
  $('#s-method').innerHTML=`
  <div class="card tint"><h2>方法内核</h2>
    <p style="font-size:16px;color:var(--green-d);font-weight:500;margin:8px 0 14px">不改动我的生活，只改动生活里的缝隙</p>
    <div class="grp-title">三个「不」</div>${D.threeNo.map(t=>`<div class="li-meta" style="font-size:13.5px;color:var(--ink);padding:3px 0">· ${esc(t)}</div>`).join('')}
    <div class="grp-title">每天 6 件小事</div>${D.six.map((t,i)=>`<div class="li-meta" style="font-size:13.5px;color:var(--ink);padding:3px 0">${i+1}. ${esc(t)}</div>`).join('')}
    <div class="note ok" style="margin-bottom:0">不算身体的账，只算日子的账。只做一件，也算没断。</div>
  </div>
  <div class="card"><h2>内容飞轮</h2><div class="flow">${D.flywheel.map((x,i)=>`${i?'<i>→</i>':''}<span>${esc(x)}</span>`).join('')}</div>
    <div class="note">最贵的一环是工具分享图自带 Day/100：每次勾格子都自动产出一张可发素材，每张图都在替连载喊「到第几天了」。</div>
  </div>
  <div class="card"><h2>命名三层分工</h2>
    <div class="tbl-scroll"><table><tr><th>层</th><th>用什么</th><th>放哪里</th><th>例子</th></tr>
    ${D.naming.map(x=>`<tr><td><b>${esc(x.l)}</b></td><td>${esc(x.w)}</td><td>${esc(x.p)}</td><td>${esc(x.e)}</td></tr>`).join('')}</table></div>
    <div class="note">「缝隙」不改，只改它出现的位置。转述用白话，记住用意象。工具界面少用它，关于页用它当品牌故事。</div>
  </div>
  <div class="card"><h2>变现路径（商单最后）</h2>
    <div class="tbl-scroll"><table><tr><th style="width:22%">阶段</th><th>动作</th><th>为什么这时做</th></tr>
    ${D.monetize.map(x=>`<tr><td><b>${esc(x.st)}</b></td><td>${esc(x.act)}</td><td>${esc(x.why)}</td></tr>`).join('')}</table></div>
    <div class="two" style="margin-top:14px">
      <div><div class="mini" style="color:var(--green-d);margin-bottom:6px">✅ 可以接</div>${D.whiteBlack.ok.map(t=>`<div class="li-meta" style="font-size:13px">· ${esc(t)}</div>`).join('')}</div>
      <div><div class="mini" style="color:var(--rose);margin-bottom:6px">🚫 绝对不接</div>${D.whiteBlack.no.map(t=>`<div class="li-meta" style="font-size:13px">· ${esc(t)}</div>`).join('')}</div>
    </div>
    <div class="note warn">体脂秤 / 卡路里 App 报价往往最高，但一接，「不算任何数字」的根基当场塌掉。这套方案的商业价值恰恰来自「什么都不卖你」。</div>
  </div>
  <div class="card"><h2>定位判断（一句话）</h2>
    <p style="margin:0;font-size:14px">需求真实且在放大，方案逐条命中；涨粉三条腿里「被记住 / 被追更」极强，<b>「被看见」是唯一短板</b>——补法只动标题和封面（3 个不 / 6 件 / 100 天 / 121→105→115），不动方法和工具。起量慢是结构性的，与「陪伴营先试、商单最后」自洽。</p>
  </div>`;
}

/* ---------- 数据 ---------- */
function rData(){
  $('#s-data').innerHTML=`
  <div class="card"><h2>数据在本机</h2>
    <p class="hint">排期状态、草稿、选题标记、自检勾选都存在这个浏览器的本地存储里，不上传、不联网也能用。换手机 / 换浏览器 / 清缓存前，先导出一份。</p>
    <div class="row"><button class="btn pri" id="expBtn">导出备份（JSON）</button><button class="btn" id="impBtn">导入备份</button><input type="file" id="impFile" accept="application/json,.json" style="display:none"></div>
    <div class="divider"></div>
    <div class="row"><button class="btn danger" id="wipeBtn">清空全部数据</button><span class="mini">不可撤销，先导出备份</span></div>
  </div>
  <div class="card"><h2>配套工具</h2>
    <p class="hint">记录工具「慢慢瘦」已上线：六格记录卡 + 分享图（带 Day/100）+ 100 天回顾页。写作台负责「写」，它负责「记」。</p>
    <a class="btn" href="https://ninayan718.github.io/daily-slim/" target="_blank" rel="noopener">打开慢慢瘦 ↗</a>
    <div class="note" style="margin-bottom:0">小红书笔记 / 评论里不要贴这个链接（站外导流高风险）。这里只是你自己用的快捷入口。</div>
  </div>
  <div class="card"><h2>合规声明</h2>
    <p class="hint" style="margin-bottom:0">本写作台内文案均为原创撰写，未复制任何对标笔记原句。所有占位符 __ 需替换为真实记录，不编数字。平台规则以小红书后台实时显示为准；发布前请人工完成合规与版权审核。</p>
  </div>`;
  $('#expBtn').addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='缝隙写作台备份_'+new Date().toLocaleDateString('sv-SE')+'.json';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('备份已导出');
  });
  $('#impBtn').addEventListener('click',()=>$('#impFile').click());
  $('#impFile').addEventListener('change',e=>{
    const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const p=JSON.parse(r.result);S=Object.assign(DEFAULT(),p);S.editor=Object.assign({ref:'',title:'',body:''},p.editor||{});save();toast('导入成功');go('today');}catch(err){toast('文件格式不对，没导入');}};
    r.readAsText(f);
  });
  $('#wipeBtn').addEventListener('click',()=>{if(!confirm('清空全部数据？建议先导出备份。'))return;if(!confirm('再确认一次：所有状态、草稿、自定义选题都会没了。'))return;S=DEFAULT();save();go('today');toast('已清空');});
}

/* ---------- common ---------- */
function commonClick(e){
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return;}
  const w=e.target.closest('[data-gowrite]');if(w){openWrite(w.dataset.gowrite);return;}
  const tw=e.target.closest('[data-twrite]');if(tw){openWrite(null,tw.dataset.twrite);return;}
  const cp=e.target.closest('[data-copy]');if(cp){copy(cp.dataset.copy,'已复制');return;}
}
function bindCommon(root){ root.onclick=commonClick; }
function openWrite(n,title){
  if(n){const x=D.schedule.find(v=>v.n==n);S.editor.ref=x.n;S.editor.title=sc(n).title||x.title;}
  else if(title){S.editor.title=title;}
  save();go('write');
}
rToday();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
